<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="assets/icons/icon32.png" width="24" height="24" alt=""><h1>ScamShield</h1></header>
  <section id="status" class="status safe"><span id="level">Checking…</span></section>
  <ul id="reasons"></ul>
  <label class="row"><span>Protection enabled</span><input type="checkbox" id="enabled"></label>
  <label class="row"><span>Hide scam content</span><input type="checkbox" id="hide"></label>
  <button id="trust" hidden>Trust this site</button>
  <p id="stat" class="stat"></p>
  <details id="msgcheck">
    <summary>📩 Check a message</summary>
    <p class="hint">Paste a suspicious SMS, WhatsApp, or email text. Checked entirely on your device — nothing is sent anywhere.</p>
    <textarea id="msgtext" rows="4" placeholder="Paste the message here…"></textarea>
    <button id="msgbtn">Check message</button>
    <div id="msgresult" hidden>
      <div id="msgstatus" class="status safe"><span id="msglevel"></span></div>
      <ul id="msgreasons"></ul>
    </div>
  </details>
  <a id="support" href="#" class="support">❤ Support ScamShield</a>
  <a id="opts" href="#">Settings</a>
  <script src="engine/constants.js"></script>
  <script src="model/url-model.js"></script>
  <script src="engine/features.js"></script>
  <script src="engine/heuristics.js"></script>
  <script src="engine/url_model.js"></script>
  <script src="engine/message_rules.js"></script>
  <script src="popup.js"></script>
</body></html>
