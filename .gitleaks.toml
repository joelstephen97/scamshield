# gitleaks configuration (used by the CI secret scan and by `gitleaks git .`).
# Extends the default ruleset; only the committed *test-only* TLS key for the
# e2e HTTPS fixture server is allowlisted. Real secrets live only in
# docs/store-secrets.local.txt, which is git-ignored.
title = "ScamShield gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test-only fixtures: self-signed localhost key for tests/e2e/server.js; the one fake Telegram bot token used by the exfil unit test"
paths = ['''tests/e2e/certs/localhost\.key''']
# Matched against the secret value only, so any other secret added to that test file is still caught.
regexes = ['''^AAH7x9Qk2LmN4pRsT6uVwXyZ0aBcDeFgHiJ$''']
