# ScamShield release
#
# Push a tag `vX.Y.Z` that matches manifest.json / manifest.firefox.json /
# package.json and this workflow:
#   version         refuses a tag that does not match the three version files
#   gate            the whole CI workflow (unit, build, lint, e2e on the packaged
#                   zips, audits, secret scan) — release.yml never re-implements it
#   github-release  SLSA build provenance attestation for both zips, then the
#                   GitHub Release with zips + SHA256SUMS + the CHANGELOG section
#   stores          Chrome Web Store upload + submit, AMO listed submission,
#                   via tools/release-stores.js in the `stores` environment
#
# Secrets (Settings -> Environments -> stores): CWS_CLIENT_ID, CWS_CLIENT_SECRET,
# CWS_REFRESH_TOKEN, CWS_EXTENSION_ID, CWS_PUBLISHER_ID, AMO_API_KEY, AMO_API_SECRET.
# Unset -> the store steps skip themselves (the GitHub Release still happens).
# Add a required reviewer on the environment for a manual "publish?" gate.
# The Chrome Web Store API cannot edit listing text or screenshots; paste those
# in the dashboard when they change (store/submission-checklist.md).
#
# Verify a downloaded zip came from this workflow:
#   gh attestation verify scamshield-chrome.zip --repo joelstephen97/scamshield
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_stores:
        description: Also submit to the Chrome Web Store and AMO
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  version:
    name: Tag matches manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          m=$(node -p "require('./manifest.json').version")
          f=$(node -p "require('./manifest.firefox.json').version")
          p=$(node -p "require('./package.json').version")
          if [ "$m" != "$f" ] || [ "$m" != "$p" ]; then
            echo "::error::version drift: manifest.json=$m manifest.firefox.json=$f package.json=$p"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$m" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $m"; exit 1
          fi
          grep -Eq "^## ${m//./\\.}\b" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $m' section"; exit 1; }
          echo "version=$m" >> "$GITHUB_OUTPUT"

  gate:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  github-release:
    name: GitHub Release
    needs: [version, gate]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scamshield-zips
          path: dist
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: node tools/release-notes.js "${{ needs.version.outputs.version }}" > dist/release-notes.md
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/scamshield-chrome.zip
            dist/scamshield-firefox.zip
      - name: Create the release (or replace its assets)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          assets="dist/scamshield-chrome.zip dist/scamshield-firefox.zip dist/SHA256SUMS"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$TAG" $assets --clobber --repo "$GITHUB_REPOSITORY"
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $assets --title "ScamShield $VERSION" --notes-file dist/release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
          echo "### Released ScamShield $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  stores:
    name: Publish to Chrome Web Store and AMO
    needs: [version, gate, github-release]
    # After a tag release, or on a manual dispatch that asked for it.
    if: >-
      !cancelled() && needs.gate.result == 'success'
      && (needs.github-release.result == 'success' || needs.github-release.result == 'skipped')
      && (github.event_name != 'workflow_dispatch' || inputs.publish_stores)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scamshield-zips
          path: dist
      - run: cd dist && sha256sum -c SHA256SUMS

      - name: Chrome Web Store (upload + submit for review)
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          if [ -z "$CWS_CLIENT_ID" ]; then
            echo "::notice::CWS secrets are not set in the 'stores' environment; skipping the Chrome Web Store"
            exit 0
          fi
          node tools/release-stores.js cws

      - name: Firefox AMO (web-ext sign, listed)
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$AMO_API_KEY" ]; then
            echo "::notice::AMO secrets are not set in the 'stores' environment; skipping AMO"
            exit 0
          fi
          node tools/release-stores.js amo
