<!doctype html><meta charset="utf-8"><title>Parry icon render</title>
<body style="font-family:sans-serif">
<div id="b"></div>
<script>
const sizes=[16,32,48,128];
for(const s of sizes){
  const c=document.createElement('canvas');c.width=c.height=s;
  const x=c.getContext('2d');
  // blade — flat-cut base, tapered to a point tip (matches tools/make-icons.js)
  x.fillStyle='#0b6e4f';x.beginPath();
  x.moveTo(s*0.2484,s*0.9484);x.lineTo(s*0.7383,s*0.4585);x.lineTo(s*0.86,s*0.16);
  x.lineTo(s*0.5615,s*0.2817);x.lineTo(s*0.0716,s*0.7716);x.closePath();x.fill();
  // dart — bold chevron bouncing off the blade (dark-green outline, white fill)
  x.lineCap='round';x.lineJoin='round';
  x.strokeStyle='#09573f';x.lineWidth=Math.max(1,s*0.214);
  x.beginPath();x.moveTo(s*0.09,s*0.12);x.lineTo(s*0.44,s*0.50);x.lineTo(s*0.68,s*0.14);x.stroke();
  x.strokeStyle='#fff';x.lineWidth=Math.max(1,s*0.17);
  x.beginPath();x.moveTo(s*0.09,s*0.12);x.lineTo(s*0.44,s*0.50);x.lineTo(s*0.68,s*0.14);x.stroke();
  const a=document.createElement('a');
  a.textContent='Download icon'+s+'.png';a.download='icon'+s+'.png';
  a.href=c.toDataURL('image/png');a.style.display='block';
  document.getElementById('b').appendChild(c);document.getElementById('b').appendChild(a);
}
</script>
