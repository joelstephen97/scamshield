.fake .field::placeholder{color:#5b6677;opacity:1}
.ui .fake .go{display:block;inline-size:100%;block-size:42px;min-block-size:42px;border:0;border-radius:21px;background:#0b3a8f;color:#fff;font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin-block-start:6px;opacity:1;cursor:default}
